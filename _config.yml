title: Debian 13 – BTS CIEL
longtitle: Debian 13 – BTS CIEL
author: David THERINCOURT
description: >-
  Procédures de post-installation de Debian 13 « Trixie »
  pour les postes du BTS CIEL (options Électronique et Physique).
lang: fr-FR

url: "https://david-therincourt.github.io"
baseurl: "/debian-bts-ciel"

remote_theme: sighingnow/jekyll-gitbook

plugins:
  - jekyll-remote-theme

# Sommaire de la page dans la barre latérale
toc:
  enabled: true
  h_min: 2
  h_max: 3

markdown: kramdown
kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    guess_lang: true
    block:
      line_numbers: false

syntax_highlighter_style: github

# Pages du site : dossier _docs, classées par nav_order dans la barre latérale
collections:
  docs:
    output: true
    sort_by: nav_order

ordered_collections:
  - docs

page_width: 800px

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
